# scripts/check.conf — Okul Yönetim Platformu (bootstrap 2026-11-17)
# Walking skeleton (spec 0001) adımları kodla birlikte etkinleştirir; yorumdaki adımlar henüz
# etkin değildir (planned). Format: scripts/check.conf.example.
#
# --- Ön koşullar ---
requires backend-build: dotnet --list-sdks | grep -q '^10\.'
# backend-integration (spec 0002, ADR 0001): OKUL_TEST_PG set (not blank) → the local PostgreSQL 18 must answer;
# unset or blank → Docker for the container path. Three lines, one reason each: doctor names the unmet command (R4).
requires backend-integration: [ -z "$(printf %s "${OKUL_TEST_PG:-}" | tr -d '[:space:]')" ] || command -v pg_isready
requires backend-integration: [ -z "$(printf %s "${OKUL_TEST_PG:-}" | tr -d '[:space:]')" ] || pg_isready -q -d "$(printf %s "$OKUL_TEST_PG" | tr -d '[:space:]')"
requires backend-integration: [ -n "$(printf %s "${OKUL_TEST_PG:-}" | tr -d '[:space:]')" ] || docker info
#
# --- Backend (active since plan 0001, step 4) ---
# resource hygiene: no MSBuild node reuse / build server (DOTNET_CLI_USE_MSBUILD_SERVER=0, -nodeReuse:false),
# build server shut down inside the same step, exit code kept
# fast: formatting (IDE0055) is enforced by backend-build; full adds the whole dotnet format (using order) — A-4
backend-format: sh -c 'export DOTNET_CLI_USE_MSBUILD_SERVER=0 DOTNET_NOLOGO=1 DOTNET_CLI_TELEMETRY_OPTOUT=1; dotnet format backend/Okul.slnx --verify-no-changes; rc=$?; dotnet build-server shutdown >/dev/null 2>&1; exit $rc'
backend-build [fast]: sh -c 'export DOTNET_CLI_USE_MSBUILD_SERVER=0 DOTNET_NOLOGO=1 DOTNET_CLI_TELEMETRY_OPTOUT=1; dotnet build backend/Okul.slnx -c Release -nodeReuse:false; rc=$?; dotnet build-server shutdown >/dev/null 2>&1; exit $rc'
# selector split (docs/testing.md, Two speeds 4): trait Category=Integration and its inverse.
# --ignore-exit-code 8 = "a test app ran zero tests" — each test project lacks the other profile's tests by design.
backend-unit [fast]: sh -c 'export DOTNET_CLI_USE_MSBUILD_SERVER=0 DOTNET_NOLOGO=1 DOTNET_CLI_TELEMETRY_OPTOUT=1; dotnet test --solution backend/Okul.slnx -c Release --no-build --filter-not-trait "Category=Integration" --ignore-exit-code 8; rc=$?; dotnet build-server shutdown >/dev/null 2>&1; exit $rc'
# resource hygiene: every run creates its own okul_test_* database and drops it at the end; dead runs' databases older
# than 60 min are swept at start (spec 0002). Local path: the PostgreSQL service runs outside check (started before it,
# not by it). Container path: a fresh PostgreSQL container per run, disposed; it lives in Docker's VM, not on the
# host — residue does not measure it (plan 0001, R6)
backend-integration: sh -c 'export DOTNET_CLI_USE_MSBUILD_SERVER=0 DOTNET_NOLOGO=1 DOTNET_CLI_TELEMETRY_OPTOUT=1; dotnet test --solution backend/Okul.slnx -c Release --no-build --filter-trait "Category=Integration" --ignore-exit-code 8; rc=$?; dotnet build-server shutdown >/dev/null 2>&1; exit $rc'
backend-vulnerable: sh -c 'out=$(DOTNET_CLI_UI_LANGUAGE=en DOTNET_CLI_USE_MSBUILD_SERVER=0 dotnet list backend/Okul.slnx package --vulnerable --include-transitive 2>&1); rc=$?; dotnet build-server shutdown >/dev/null 2>&1; echo "$out" | grep -E "has the following vulnerable|High|Critical" ; [ $rc -eq 0 ] && ! echo "$out" | grep -Eq "(High|Critical)"'
#
# --- Web (active since plan 0001, step 6) ---
requires web-test: node -e "process.exit(+process.versions.node.split('.')[0] >= 24 ? 0 : 1)"
web-lint [fast]: npm run -w @okul/web lint
web-typecheck [fast]: npm run -w @okul/web typecheck
# resource hygiene: no watch mode (vitest --run), single worker (vite.config.ts)
web-test [fast]: npm run -w @okul/web test
#
# --- Mobile (active since plan 0001, step 7) ---
mobile-lint [fast]: npm run -w @okul/mobile lint
mobile-typecheck [fast]: npm run -w @okul/mobile typecheck
# resource hygiene: no watch mode (jest --watchAll=false), no watchman
mobile-test [fast]: npm run -w @okul/mobile test
#
# --- Dependencies ---
# plan 0001, A-2: high/critical breaks check; no allowlist (GHSA-fc5q-39xc-vjpf no longer reported, 2026-11-18)
npm-audit: npm audit --audit-level=high
